services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=homeapp
      - POSTGRES_PASSWORD=homeapp123
      - POSTGRES_DB=homeapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - homeapp

  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    networks:
      - homeapp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - backend-data:/usr/src/app/data
      - backend-node-modules:/usr/src/app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - mqtt
    networks:
      - homeapp

  nextjs:
    build:
      context: ./nextjsapp
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./nextjsapp:/usr/src/app
      - nextjs-node-modules:/usr/src/app/node_modules
      - nextjs-build:/usr/src/app/.next
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgres://homeapp:homeapp123@postgres:5432/homeapp
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - backend
      - postgres
    networks:
      - homeapp

  expo:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "19006:19006"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./app:/usr/src/app
      - expo-node-modules:/usr/src/app/node_modules
    environment:
      - EXPO_NO_DOCTOR=1
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_PUBLIC_API_URL=http://backend:3000/api
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - homeapp

volumes:
  postgres-data:
  backend-data:
  backend-node-modules:
  nextjs-node-modules:
  nextjs-build:
  expo-node-modules:

networks:
  homeapp:
    driver: bridge
