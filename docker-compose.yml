services:
  postgres:
    image: postgres:15-alpine
    network_mode: host
    environment:
      - POSTGRES_USER=homeapp
      - POSTGRES_PASSWORD=homeapp123
      - POSTGRES_DB=homeapp
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2.0
    network_mode: host
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./backend:/usr/src/app
      - backend-data:/usr/src/app/data
      - backend-node-modules:/usr/src/app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - mqtt

  nextjs:
    build:
      context: ./nextjsapp
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./nextjsapp:/usr/src/app
      - nextjs-node-modules:/usr/src/app/node_modules
      - nextjs-build:/usr/src/app/.next
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgres://homeapp:homeapp123@localhost:5432/homeapp
      - MQTT_HOST=localhost
      - MQTT_PORT=1883
    depends_on:
      - backend
      - postgres

  expo:
    build:
      context: ./app
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./app:/usr/src/app
      - expo-node-modules:/usr/src/app/node_modules
    environment:
      - EXPO_NO_DOCTOR=1
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_PUBLIC_API_URL=http://localhost:3000/api
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-data:
  backend-node-modules:
  nextjs-node-modules:
  nextjs-build:
  expo-node-modules:
  mosquitto-data:
  mosquitto-log:
